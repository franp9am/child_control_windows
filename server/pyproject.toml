[project]
name = "child-control-server"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "uvicorn",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["app.py", "db.py", "add_device.py", "templates"]
