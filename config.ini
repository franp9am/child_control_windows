# Settings for monitor.py, remaining_time_widget.py and create_code.py.
# Anything left out here falls back to the defaults in config.py.

[general]
# Child's windows account, as it shows up in `query user`.
target_user = elias

[paths]
# Files the child's account can reach. C:\Users\Public is readable and
# writable by every local account by default, so nothing extra to grant.
redeem_file = C:\Users\Public\eli_redeem_time.txt
remaining_time_file = C:\Users\Public\eli_remaining_time.txt
# Where monitor.py keeps the per-day json files, the used-code list and the
# shared secret. Relative paths are resolved against this config file.
data_dir = data
secret_file = sec.txt                     ; inside data_dir
used_codes_file = used_redeem_codes.json  ; inside data_dir

[limits]
daily_limit_seconds = 7200         ; 2 hours
check_interval_seconds = 60        ; how often monitor.py ticks
shutdown_delay_seconds = 300       ; grace period once the time is up
night_shutdown_delay_seconds = 10  ; grace period outside the allowed hours
startup_delay_seconds = 60         ; wait after boot before the first check
earliest_hour_included = 6
latest_hour_included = 20

[redeem]
# Length of the signature in a redeem code. create_code.py reads the same
# value, but changing it invalidates codes that were already handed out.
signature_chars = 4
max_file_bytes = 128  ; ignore oversized redeem files

[widget]
poll_interval_ms = 5000
margin_px = 20
opacity = 0.85
font_family = Segoe UI
font_size = 14
warning_seconds = 900   ; text turns orange below this
critical_seconds = 300  ; text turns red below this
color_normal = #2ecc71
color_warning = #f39c12
color_critical = #e74c3c
